<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snake</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #505050;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="0" aria-label="Snake game. Arrow keys or WASD to move, Space to start or restart, P to pause."></canvas>
    <noscript>This game requires JavaScript and WebAssembly.</noscript>
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
      load("snake-wasm.wasm");
      document.getElementById("glcanvas").focus();
    </script>
  </body>
</html>
